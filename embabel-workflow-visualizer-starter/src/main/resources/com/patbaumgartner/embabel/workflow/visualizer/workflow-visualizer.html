<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embabel Workflow Visualizer</title>
    <link rel="icon" href="data:," />
    <!-- Restore theme before first paint to prevent flash of wrong theme -->
    <script nonce="__CSP_NONCE__">
        try {
            var _t = localStorage.getItem('embabel-theme');
            if (_t === 'light' || _t === 'dark')
                document.documentElement.setAttribute('data-theme', _t);
        } catch (_) { }
    </script>
    <style>
        /* ── Theme tokens ──────────────────────────────────────────────── */
        /*
           The brand palette is declared twice, once per theme. Every brand colour
           is carried as text or as a border — a node's type label, a badge, an
           edge caption — never as a fill behind text, so each one has to hold up
           against the surface its theme actually paints. The values below are
           tuned for the dark card; the light theme restates all six darker,
           because the same hues that read cleanly on #111a2a drop to between
           1.6:1 and 3.9:1 on a white card, well under WCAG AA.
        */
        :root {
            color-scheme: dark;
            --brand-cyan: #2bb7e0;
            --brand-pink: #e4457d;
            --brand-green: #6ec829;
            --brand-yellow: #ffc600;
            --brand-orange: #ff6c2c;
            --brand-purple: #ac75c2;
            --bg: #0a1220;
            --bg-2: #0c1630;
            --card: #111a2a;
            --ink: #e5e7eb;
            --muted: #cbd5e1;
            --line: rgba(255, 255, 255, .14);
            --hdr-bg: rgba(10, 18, 32, 0.88);
            --shadow: rgba(0, 0, 0, 0.35);
            --action: var(--brand-cyan);
            --condition: var(--brand-yellow);
            --goal: var(--brand-green);
            --cost: var(--brand-pink);
            --llmtool: var(--brand-purple);
            --type-col: var(--brand-orange);
            --focus-ring: #7fdcff;
        }

        body {
            background:
                radial-gradient(1200px 800px at 10% -10%, color-mix(in oklab, var(--brand-cyan) 18%, transparent), transparent 60%),
                radial-gradient(1000px 700px at 110% 20%, color-mix(in oklab, var(--brand-pink) 14%, transparent), transparent 60%),
                radial-gradient(900px 700px at 80% 110%, color-mix(in oklab, var(--brand-green) 9%, transparent), transparent 55%),
                var(--bg);
        }

        @media (prefers-color-scheme: light) {
            :root:not([data-theme="dark"]) {
                color-scheme: light;
                --brand-cyan: #167895;
                --brand-pink: #d51f5f;
                --brand-green: #457d1a;
                --brand-yellow: #8a6b00;
                --brand-orange: #ca3d00;
                --brand-purple: #9753b3;
                --bg: #f0f4fa;
                --bg-2: #ffffff;
                --card: #ffffff;
                --ink: #0f172a;
                --muted: #475569;
                --line: rgba(0, 0, 0, .12);
                --hdr-bg: rgba(248, 250, 252, 0.92);
                --shadow: rgba(0, 0, 0, 0.10);
                --focus-ring: #0b5f8c;
            }

            :root:not([data-theme="dark"]) body {
                background:
                    radial-gradient(1200px 800px at 10% -10%, color-mix(in oklab, var(--brand-cyan) 12%, transparent), transparent 60%),
                    radial-gradient(1000px 700px at 110% 20%, color-mix(in oklab, var(--brand-pink) 8%, transparent), transparent 60%),
                    var(--bg);
            }
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --brand-cyan: #167895;
            --brand-pink: #d51f5f;
            --brand-green: #457d1a;
            --brand-yellow: #8a6b00;
            --brand-orange: #ca3d00;
            --brand-purple: #9753b3;
            --bg: #f0f4fa;
            --bg-2: #ffffff;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #475569;
            --line: rgba(0, 0, 0, .12);
            --hdr-bg: rgba(248, 250, 252, 0.92);
            --shadow: rgba(0, 0, 0, 0.10);
            --focus-ring: #0b5f8c;
        }

        :root[data-theme="light"] body {
            background:
                radial-gradient(1200px 800px at 10% -10%, color-mix(in oklab, var(--brand-cyan) 12%, transparent), transparent 60%),
                radial-gradient(1000px 700px at 110% 20%, color-mix(in oklab, var(--brand-pink) 8%, transparent), transparent 60%),
                var(--bg);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0a1220;
            --bg-2: #0c1630;
            --card: #111a2a;
            --ink: #e5e7eb;
            --muted: #cbd5e1;
            --line: rgba(255, 255, 255, .14);
            --hdr-bg: rgba(10, 18, 32, 0.88);
            --shadow: rgba(0, 0, 0, 0.35);
            --focus-ring: #7fdcff;
        }

        :root[data-theme="dark"] body {
            background:
                radial-gradient(1200px 800px at 10% -10%, color-mix(in oklab, var(--brand-cyan) 18%, transparent), transparent 60%),
                radial-gradient(1000px 700px at 110% 20%, color-mix(in oklab, var(--brand-pink) 14%, transparent), transparent 60%),
                radial-gradient(900px 700px at 80% 110%, color-mix(in oklab, var(--brand-green) 9%, transparent), transparent 55%),
                var(--bg);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", "SF Pro Text", "Inter", Roboto, Ubuntu, Cantarell, sans-serif;
            color: var(--ink);
            min-height: 100vh;
            transition: background 0.3s, color 0.2s;
        }

        /* ── Header ────────────────────────────────────────────────────── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding: 0.875rem 1.5rem;
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            background: var(--hdr-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            transition: background 0.2s, border-color 0.2s;
        }

        header h1 {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: -0.015em;
        }

        .hdr-right {
            display: flex;
            align-items: center;
            gap: 0.875rem;
            flex-wrap: wrap;
        }

        .hint {
            font-size: 0.76rem;
            color: var(--muted);
        }

        .hint code {
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            background: var(--bg-2);
            border: 1px solid var(--line);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 0.26rem 0.75rem;
            font-size: 0.78rem;
            font-family: inherit;
            color: var(--ink);
            cursor: pointer;
            white-space: nowrap;
            transition: border-color 0.15s, background 0.2s;
        }

        .theme-btn:hover {
            border-color: var(--muted);
        }

        /* ── Main canvas ───────────────────────────────────────────────── */
        main {
            padding: 1.5rem;
            max-width: none;
            margin: 0 auto;
        }

        /* ── Agent panel ───────────────────────────────────────────────── */
        .agent {
            margin-bottom: 2rem;
            border: 1px solid var(--line);
            background: var(--bg-2);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            transition: background 0.2s, border-color 0.2s;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .agent-title-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            /* A flex item defaults to min-width:auto and so refuses to shrink below
               its longest word. Agent and class names come from the application being
               described, so an unbroken one would push the header past the viewport
               instead of wrapping. */
            min-width: 0;
        }

        .agent-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--action);
            overflow-wrap: anywhere;
        }

        /* Planner type badge */
        .planner-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 2px 9px;
            border-radius: 20px;
            border: 1.5px solid;
            white-space: nowrap;
        }

        .planner-goap {
            color: var(--brand-cyan);
            border-color: var(--brand-cyan);
            background: rgba(43, 183, 224, 0.12);
        }

        .planner-utility {
            color: var(--brand-yellow);
            border-color: var(--brand-yellow);
            background: rgba(255, 198, 0, 0.12);
        }

        .planner-supervisor {
            color: var(--brand-pink);
            border-color: var(--brand-pink);
            background: rgba(228, 69, 125, 0.12);
        }

        .planner-hybrid {
            color: var(--brand-orange);
            border-color: var(--brand-orange);
            background: rgba(255, 108, 44, 0.12);
        }

        .planner-component {
            color: var(--brand-green);
            border-color: var(--brand-green);
            background: rgba(110, 200, 41, 0.12);
        }

        /* Opaque badge */
        .opaque-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.63rem;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.15);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: var(--muted);
            white-space: nowrap;
        }

        .agent-meta {
            font-size: 0.72rem;
            color: var(--muted);
            font-family: ui-monospace, Consolas, monospace;
            margin-top: 0.15rem;
            /* Fully-qualified class names, bean names and SpEL retry expressions are
               long and unbroken, and all three come from the described application. */
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .agent .desc {
            font-size: 0.88rem;
            color: var(--muted);
            margin-bottom: 0.85rem;
            line-height: 1.5;
        }

        /* ── Legend ────────────────────────────────────────────────────── */
        .legend {
            display: flex;
            gap: 0.875rem;
            flex-wrap: wrap;
            margin-bottom: 0.85rem;
            font-size: 0.72rem;
            color: var(--muted);
        }

        .leg-item {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ── Flow container ────────────────────────────────────────────── */
        .flow {
            position: relative;
            overflow: auto;
            width: 100%;
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--bg);
            height: min(72vh, 660px);
            min-height: 200px;
            cursor: default;
            transition: border-color 0.2s;
        }

        .flow-svg {
            display: block;
            width: 100%;
            height: 100%;
            user-select: none;
            -webkit-user-select: none;
            /* The browser keeps vertical panning, so a diagram never traps the page
               scroll on a touch device; sideways gestures are left to the canvas. */
            touch-action: pan-y;
        }

        /* ── Zoom controls ─────────────────────────────────────────────── */
        .flow-controls {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.45rem;
            flex-wrap: wrap;
        }

        .flow-btn {
            display: inline-flex;
            align-items: center;
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0.22rem 0.65rem;
            font-size: 0.73rem;
            font-family: inherit;
            color: var(--ink);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            white-space: nowrap;
            user-select: none;
        }

        .flow-btn:hover {
            border-color: var(--action);
            color: var(--action);
        }

        .flow-hint {
            font-size: 0.68rem;
            color: var(--muted);
            margin-left: 0.25rem;
        }

        /* ── SVG node rect ─────────────────────────────────────────────── */
        .node-card {
            fill: var(--card);
            stroke-width: 2;
            filter: drop-shadow(0 2px 8px var(--shadow));
        }

        .node-card.action {
            stroke: var(--action);
        }

        .node-card.condition {
            stroke: var(--condition);
        }

        .node-card.achievesgoal {
            stroke: var(--goal);
            filter: drop-shadow(0 2px 8px var(--shadow)) drop-shadow(0 0 10px color-mix(in oklab, var(--goal) 44%, transparent));
        }

        .node-card.cost {
            stroke: var(--cost);
        }

        .node-card.llmtool {
            stroke: var(--llmtool);
            stroke-dasharray: 5 3;
        }

        /* ── SVG edges ─────────────────────────────────────────────────── */
        .edge {
            fill: none;
            stroke-width: 1.5;
        }

        .edge.pre {
            stroke: var(--condition);
            stroke-dasharray: 5 4;
        }

        .edge.type {
            stroke: var(--type-col);
            stroke-opacity: 0.75;
        }

        .edge.cost {
            stroke: var(--cost);
            stroke-dasharray: 3 3;
            stroke-opacity: 0.85;
        }

        .edge-lbl {
            font-size: 9.5px;
            fill: var(--muted);
            font-family: ui-monospace, Consolas, monospace;
        }

        /* ── foreignObject node content ─────────────────────────────────── */
        /* Keep this HTML in normal flow, without opacity/positioned layers.
           WebKit can paint such layers outside the SVG node's transform. */
        .nfo {
            font-family: Inter, system-ui, sans-serif;
            padding: 10px 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        .ntype-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .ntype {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            line-height: 1;
        }

        .ntype.action {
            color: var(--action);
        }

        .ntype.condition {
            color: var(--condition);
        }

        .ntype.achievesgoal {
            color: var(--goal);
        }

        .ntype.cost {
            color: var(--cost);
        }

        .ntype.llmtool {
            color: var(--llmtool);
        }

        /* Micro-badges inside node */
        .nb {
            display: inline-flex;
            align-items: center;
            font-size: 7.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 1px 5px;
            border-radius: 3px;
            line-height: 1.5;
            max-width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .nb-rerun {
            background: rgba(255, 108, 44, 0.22);
            color: var(--brand-orange);
        }

        .nb-readonly {
            background: rgba(43, 183, 224, 0.18);
            color: var(--brand-cyan);
        }

        .nb-llmtool {
            background: rgba(155, 89, 182, 0.22);
            color: var(--brand-purple);
        }

        .nb-clearbb {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
        }

        .nb-goal {
            background: rgba(110, 200, 41, 0.18);
            color: var(--brand-green);
        }

        .nb-mcp {
            background: rgba(255, 198, 0, 0.2);
            color: var(--brand-yellow);
        }

        .nb-trigger {
            background: rgba(236, 72, 153, 0.18);
            color: #f472b6;
        }

        .nb-returndirect {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .nb-planner {
            background: rgba(43, 183, 224, 0.22);
            color: var(--brand-cyan);
        }

        .nb-unregistered {
            background: rgba(148, 163, 184, 0.2);
            color: var(--muted);
        }

        /* A declared step the planner does not run: present, but not part of the plan. */
        .node-card.not-registered {
            stroke-dasharray: 3 4;
            opacity: 0.72;
        }

        .planner-runtime {
            color: var(--brand-purple);
            border-color: var(--brand-purple);
            background: rgba(155, 89, 182, 0.12);
        }

        .nname {
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.25;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .nmeth {
            font-size: 9px;
            color: var(--muted);
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            line-height: 1.3;
            word-break: break-all;
        }

        .nio {
            font-size: 10px;
            color: var(--type-col);
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            line-height: 1.4;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .nio .obind {
            color: var(--brand-orange);
            font-style: italic;
        }

        .nio .alt {
            color: var(--muted);
            font-style: italic;
        }

        .nrow {
            font-size: 9.5px;
            line-height: 1.4;
            color: var(--muted);
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .nrow .lbl {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 8px;
            margin-right: 4px;
        }

        .nrow.cpre .lbl,
        .nrow.cpre .val {
            color: var(--condition);
        }

        .nrow.cpost .lbl,
        .nrow.cpost .val {
            color: var(--goal);
        }

        .nrow.ccost .lbl,
        .nrow.ccost .val {
            color: var(--cost);
        }

        .nrow.cval .lbl,
        .nrow.cval .val {
            color: var(--cost);
        }

        .nrow.cgoalval .lbl,
        .nrow.cgoalval .val {
            color: var(--goal);
        }

        .nrow.cspel .val {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 9px;
            color: var(--brand-orange);
        }

        .nrow code {
            font-family: ui-monospace, Consolas, monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 0 3px;
            border-radius: 3px;
        }

        .ndesc {
            font-size: 9.5px;
            color: var(--muted);
            line-height: 1.4;
            font-style: italic;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .nexs {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .nex {
            font-size: 8.5px;
            color: var(--muted);
            line-height: 1.35;
            display: flex;
            gap: 4px;
        }

        .nex::before {
            content: '\201C';
            flex: none;
            color: var(--brand-cyan);
        }

        .ntags {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .ntag {
            display: inline-flex;
            font-size: 8px;
            font-weight: 600;
            padding: 1px 5px;
            border-radius: 10px;
            background: rgba(110, 200, 41, 0.15);
            color: var(--brand-green);
            border: 1px solid rgba(110, 200, 41, 0.3);
            max-width: 100%;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        /* Off-screen measuring container */
        .measure-host {
            position: absolute;
            left: -10000px;
            top: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .measure-host .nfo-wrap {
            display: inline-block;
        }

        /* ── View tabs (Flow / Dependencies) ───────────────────────────── */
        .view-tabs {
            display: inline-flex;
            gap: 0.25rem;
            margin-bottom: 0.85rem;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--bg);
        }

        .view-tab {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 0.28rem 0.8rem;
            font-size: 0.76rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.15s, background 0.15s, border-color 0.15s;
        }

        .view-tab:hover {
            color: var(--ink);
        }

        .view-tab[aria-selected="true"] {
            background: var(--bg-2);
            border-color: var(--line);
            color: var(--action);
        }

        .view-panel[hidden] {
            display: none;
        }

        /* Vertical drag handle below each view, so the reader can size the
           diagram; the Flow and Dependencies panels always share a height. */
        .view-resize {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 14px;
            margin-top: 0.5rem;
            cursor: ns-resize;
            touch-action: none;
        }

        .view-resize::before {
            content: '';
            width: 3rem;
            height: 3px;
            border-radius: 3px;
            background: var(--line);
        }

        .view-resize:focus-visible::before,
        .view-resize:hover::before,
        .view-resize:active::before {
            background: var(--muted);
        }

        /* ── Flow chart shapes ─────────────────────────────────────────── */
        .fterm {
            fill: var(--card);
            stroke-width: 2;
            filter: drop-shadow(0 2px 8px var(--shadow));
        }

        .fterm.start {
            stroke: var(--ink);
        }

        .fterm.end {
            stroke: var(--goal);
            filter: drop-shadow(0 2px 8px var(--shadow)) drop-shadow(0 0 10px color-mix(in oklab, var(--goal) 44%, transparent));
        }

        .fterm-lbl {
            font-size: 12px;
            font-weight: 800;
            fill: var(--ink);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: Inter, system-ui, sans-serif;
        }

        .fterm-sub {
            font-size: 10px;
            fill: var(--type-col);
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        }

        .fdecision {
            fill: var(--card);
            stroke: var(--condition);
            stroke-width: 2;
            filter: drop-shadow(0 2px 8px var(--shadow));
        }

        .fdecision.planner {
            stroke: var(--brand-purple);
        }

        .fdecision.state {
            stroke: var(--type-col);
        }

        .fdec-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            gap: 2px;
            overflow: hidden;
            font-family: Inter, system-ui, sans-serif;
        }

        .fdec-kind {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--condition);
        }

        .fdecision.planner+foreignObject .fdec-kind {
            color: var(--brand-purple);
        }

        .fdecision.state+foreignObject .fdec-kind {
            color: var(--type-col);
        }

        .fdec-lbl {
            font-size: 10px;
            color: var(--ink);
            line-height: 1.25;
            overflow-wrap: anywhere;
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        }

        .fbar {
            fill: var(--action);
            stroke: none;
            filter: drop-shadow(0 2px 6px var(--shadow));
        }

        .fbar-lbl {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            fill: var(--muted);
            font-family: Inter, system-ui, sans-serif;
        }

        .fgroup-lbl {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            fill: var(--muted);
            font-family: Inter, system-ui, sans-serif;
        }

        .fgroup-box {
            fill: none;
            stroke: var(--line);
            stroke-dasharray: 4 4;
        }

        .nb-detached {
            background: rgba(148, 163, 184, 0.2);
            color: var(--muted);
        }

        /* Flow chart edges: a neutral hand-over, the cheapest route in goal green,
           branches off a decision in the condition colour, loops in orange. */
        .edge.flow {
            stroke: var(--muted);
            stroke-opacity: 0.6;
        }

        .edge.branch {
            stroke: var(--condition);
            stroke-dasharray: 5 4;
        }

        .edge.cheapest {
            stroke: var(--goal);
            stroke-opacity: 1;
            stroke-width: 2.5;
        }

        .edge.loop {
            stroke: var(--brand-orange);
            stroke-dasharray: 6 4;
        }

        .edge-lbl.loop {
            fill: var(--brand-orange);
        }

        .edge-lbl.branch {
            fill: var(--condition);
        }

        .edge-lbl.types {
            fill: var(--type-col);
        }

        /* A route hovered in the table lights up on the drawing. */
        .flow-svg.has-hover .edge.path-hi {
            stroke-opacity: 1;
            stroke-width: 2.5;
        }

        .flow-svg.has-hover .edge-lbl.path-hi {
            opacity: 1;
        }

        /* ── Flow facts below the chart ────────────────────────────────── */
        .flow-facts {
            margin-top: 0.7rem;
            font-size: 0.78rem;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .flow-facts code,
        .paths code {
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            font-size: 0.74rem;
            color: var(--type-col);
        }

        .flow-note {
            font-size: 0.74rem;
            font-style: italic;
        }

        .flow-warn {
            color: var(--brand-orange);
        }

        .paths summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--ink);
            font-size: 0.8rem;
            user-select: none;
        }

        .paths table {
            border-collapse: collapse;
            margin-top: 0.5rem;
            width: 100%;
            table-layout: fixed;
            font-size: 0.78rem;
        }

        .paths th,
        .paths td {
            text-align: left;
            padding: 0.35rem 0.6rem;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .paths th {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .paths td.num {
            font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
            white-space: nowrap;
        }

        .paths tr.cheapest td {
            color: var(--goal);
        }

        .paths tr.cheapest td code {
            color: var(--goal);
        }

        .paths tbody tr:hover td,
        .paths tbody tr:focus-within td {
            background: color-mix(in oklab, var(--action) 10%, transparent);
        }

        .paths .goal-name {
            color: var(--goal);
            font-weight: 600;
        }

        .paths .arrow {
            color: var(--muted);
            padding: 0 0.2rem;
        }

        /* ── Utility ───────────────────────────────────────────────────── */
        .empty {
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 8px;
            padding: 1.25rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.35);
        }

        /* ── Footer ────────────────────────────────────────────────────── */
        footer {
            margin-top: 2.5rem;
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.76rem;
            color: var(--muted);
            background: var(--hdr-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.2s, border-color 0.2s;
        }

        footer a {
            color: var(--action);
            text-decoration: none;
            transition: color 0.15s;
        }

        footer a:hover {
            color: var(--brand-cyan);
            text-decoration: underline;
        }

        .footer-heart {
            color: var(--brand-pink);
        }

        /* ── Node drag / hover / keyboard focus ─────────────────────────── */
        .node-hit {
            cursor: move;
        }

        /* The focus ring is a drawn SVG rect rather than an outline: outlines on
           SVG elements are rendered inconsistently across browsers, and a drawn
           ring keeps its own width at every zoom level. */
        .node-focus {
            fill: none;
            stroke: var(--focus-ring);
            stroke-width: 3;
            vector-effect: non-scaling-stroke;
            opacity: 0;
            pointer-events: none;
        }

        .node-g:focus {
            outline: none;
        }

        .node-g:focus .node-focus {
            opacity: 1;
        }

        .node-g.dragging .node-card {
            filter: drop-shadow(0 2px 6px var(--shadow)) drop-shadow(0 0 20px color-mix(in oklab, var(--action) 55%, transparent));
        }

        .flow-svg.has-hover .node-g {
            opacity: 0.18;
            transition: opacity 0.15s;
        }

        .flow-svg.has-hover .node-g.node-hi {
            opacity: 1;
        }

        .flow-svg.has-hover .node-g.dragging {
            opacity: 1;
        }

        /* A focused node stays legible while another node is hovered, so its
           focus ring never fades out from under the keyboard user. */
        .flow-svg.has-hover .node-g:focus {
            opacity: 1;
        }

        .flow-svg.has-hover .edge {
            stroke-opacity: 0.07;
            transition: stroke-opacity 0.15s;
        }

        .flow-svg.has-hover .edge.edge-hi {
            stroke-opacity: 1 !important;
            stroke-width: 2.5;
        }

        .flow-svg.has-hover .edge-lbl {
            opacity: 0.07;
        }

        .flow-svg.has-hover .edge-lbl.edge-hi {
            opacity: 1;
        }

        @keyframes dash-flow {
            to {
                stroke-dashoffset: -18;
            }
        }

        .edge.pre {
            animation: dash-flow 1.3s linear infinite;
        }

        /* Vestibular safety: never animate for visitors who asked us not to. */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        /* Keyboard focus must be visible on every interactive control. */
        :where(button, input, a):focus-visible {
            outline: 2px solid var(--action);
            outline-offset: 2px;
        }

        /* ── Filter ────────────────────────────────────────────────────── */
        .filter {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .filter input {
            background: var(--bg-2);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 0.26rem 0.75rem;
            font-size: 0.78rem;
            font-family: inherit;
            color: var(--ink);
            min-width: 12rem;
        }

        .filter input::placeholder {
            color: var(--muted);
        }

        .agent[hidden] {
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Embabel Workflow Visualizer</h1>
        <div class="hdr-right">
            <span class="hint" id="endpoint-hint"></span>
            <span class="filter">
                <label class="hint" for="agent-filter">Filter</label>
                <input type="search" id="agent-filter" placeholder="Agent name, class or planner"
                    autocomplete="off" spellcheck="false" />
            </span>
            <span class="hint" id="agent-count" role="status" aria-live="polite"></span>
            <button type="button" class="theme-btn" id="theme-btn" aria-pressed="false">
                <span id="theme-icon" aria-hidden="true"></span><span id="theme-lbl"></span>
            </button>
        </div>
    </header>
    <main id="canvas">
        <p class="empty">Loading workflows&hellip;</p>
    </main>
    <!--
        Outside #canvas, which every render clears. Owning it here rather than
        appending it to one of render()'s three exits is what stops the filter
        from reaching for an element that a given exit never created.
    -->
    <p class="empty" id="no-match" hidden>No agent matches this filter.</p>

    <script nonce="__CSP_NONCE__">
        // ── Theme ──────────────────────────────────────────────────────────
        function isDark() {
            var t = document.documentElement.getAttribute('data-theme');
            if (t === 'dark') return true;
            if (t === 'light') return false;
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        function syncThemeIcon() {
            var dark = isDark();
            var btn = document.getElementById('theme-btn');
            document.getElementById('theme-icon').textContent = dark ? '\u2600\uFE0F\u00A0' : '\uD83C\uDF19\u00A0';
            document.getElementById('theme-lbl').textContent = dark ? 'Light' : 'Dark';
            btn.setAttribute('aria-pressed', String(dark));
            btn.setAttribute('title', dark ? 'Switch to the light theme' : 'Switch to the dark theme');
        }
        function toggleTheme() {
            var next = isDark() ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('embabel-theme', next); } catch (_) { }
            syncThemeIcon();
        }
        document.getElementById('theme-btn').addEventListener('click', toggleTheme);
        syncThemeIcon();
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (!document.documentElement.hasAttribute('data-theme')) syncThemeIcon();
        });

        // ── Layout constants ──────────────────────────────────────────────
        var NW = 340;   // node width (fixed for predictable layout)
        var NH_MIN = 110;   // minimum node height
        var NH_FALLB = 200;   // fallback height if measurement is unavailable
        var CG = 110;   // column gap
        var RG = 36;    // row gap
        var PAD = 28;    // svg outer padding
        var KSTEP = 10;   // arrow-key node nudge
        var KSTEP_BIG = 50;   // shift + arrow-key node nudge

        // ── HTML escaping ─────────────────────────────────────────────────
        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ── Layout ────────────────────────────────────────────────────────
        function computeLayout(steps, heights) {
            var condProd = new Map();
            var typeProd = new Map();
            var costProd = new Map();

            steps.forEach(function (s, i) {
                (s.post || []).forEach(function (c) {
                    if (!condProd.has(c)) condProd.set(c, []);
                    condProd.get(c).push(i);
                });
                if (s.output && s.output !== 'void' && s.output !== 'boolean') {
                    if (!typeProd.has(s.output)) typeProd.set(s.output, []);
                    typeProd.get(s.output).push(i);
                }
                (s.possibleOutputs || []).forEach(function (t) {
                    if (!typeProd.has(t)) typeProd.set(t, []);
                    typeProd.get(t).push(i);
                });
                if (s.type === 'Condition') {
                    if (!condProd.has(s.name)) condProd.set(s.name, []);
                    condProd.get(s.name).push(i);
                }
                if (s.type === 'Cost') costProd.set(s.name, i);
            });

            var deps = steps.map(function () { return new Set(); });
            var rawEdges = [];

            function addEdge(src, dst, kind, label) {
                if (src === dst) return;
                deps[dst].add(src);
                rawEdges.push({ from: src, to: dst, kind: kind, label: label });
            }

            steps.forEach(function (s, i) {
                (s.pre || []).forEach(function (c) {
                    // Strip SpEL prefix for matching ("spel:foo > 0.5" → don't try to match)
                    if (typeof c === 'string' && c.indexOf('spel:') === 0) return;
                    (condProd.get(c) || []).forEach(function (src) { addEdge(src, i, 'pre', c); });
                });
                // @Provided parameters come from the platform context rather than the
                // blackboard, so whatever else produces that type did not produce this.
                var provided = new Set(s.providedInputs || []);
                (s.inputs || []).forEach(function (t) {
                    if (provided.has(t)) return;
                    (typeProd.get(t) || []).forEach(function (src) { addEdge(src, i, 'type', t); });
                });
                if (s.costMethod && costProd.has(s.costMethod)) addEdge(costProd.get(s.costMethod), i, 'cost', 'costMethod');
                if (s.valueMethod && costProd.has(s.valueMethod)) addEdge(costProd.get(s.valueMethod), i, 'cost', 'valueMethod');
            });

            // Deduplicate edges. Labels are collected exactly: substring matching would
            // drop "Order" as already present in "OrderId", and drop it or not depending
            // on which of the two the scan happened to reach first.
            var edgeMap = new Map();
            rawEdges.forEach(function (e) {
                var key = e.from + '-' + e.to + '-' + e.kind;
                if (!edgeMap.has(key)) {
                    edgeMap.set(key, { from: e.from, to: e.to, kind: e.kind, labels: e.label ? [e.label] : [] });
                } else {
                    var labels = edgeMap.get(key).labels;
                    if (e.label && labels.indexOf(e.label) === -1) labels.push(e.label);
                }
            });
            var edges = Array.from(edgeMap.values()).map(function (e) {
                return { from: e.from, to: e.to, kind: e.kind, label: e.labels.join(', ') };
            });

            // Topological column assignment (iterative, cycle-safe).
            // Hard cap at steps.length - 1 so cycles cannot inflate the column count.
            var maxCol = Math.max(0, steps.length - 1);
            var col = steps.map(function () { return 0; });
            for (var pass = 0; pass < steps.length + 6; pass++) {
                var changed = false;
                steps.forEach(function (_, i) {
                    var c = 0;
                    deps[i].forEach(function (d) { c = Math.max(c, col[d] + 1); });
                    if (c > maxCol) c = maxCol;
                    if (col[i] !== c) { col[i] = c; changed = true; }
                });
                if (!changed) break;
            }

            // The cap above stops a cycle inflating the column count, but it does not
            // stop it emptying the columns in between: every member of a revision loop
            // is pushed to the cap, so a five-step agent can occupy columns 0 and 4 and
            // nothing else. Those empty columns still counted towards the canvas width,
            // so auto-fit scaled the whole diagram down to a width its content never
            // used. Only the columns something actually sits in survive.
            var usedCols = Array.from(new Set(col)).sort(function (a, b) { return a - b; });
            var denseCol = {};
            usedCols.forEach(function (c, i) { denseCol[c] = i; });
            col = col.map(function (c) { return denseCol[c]; });

            var cols = {};
            steps.forEach(function (_, i) {
                if (!cols[col[i]]) cols[col[i]] = [];
                cols[col[i]].push(i);
            });

            // Math.max of an empty column set is -Infinity; keep the canvas finite.
            var numCols = Math.max(1, Math.max.apply(null, Object.keys(cols).map(Number)) + 1);

            // Per-column height (sum of node heights + row gaps)
            var colHeights = {};
            var maxColH = 0;
            Object.keys(cols).forEach(function (c) {
                var idxs = cols[c];
                var sum = 0;
                idxs.forEach(function (idx, k) {
                    sum += heights[idx];
                    if (k < idxs.length - 1) sum += RG;
                });
                colHeights[c] = sum;
                if (sum > maxColH) maxColH = sum;
            });
            var svgH = maxColH + PAD * 2;
            var svgW = numCols * (NW + CG) - CG + PAD * 2;

            // Vertically centre each column
            var pos = steps.map(function () { return { x: 0, y: 0 }; });
            Object.keys(cols).forEach(function (c) {
                var idxs = cols[c];
                var startY = PAD + (svgH - PAD * 2 - colHeights[c]) / 2;
                var y = startY;
                idxs.forEach(function (idx) {
                    pos[idx] = { x: Number(c) * (NW + CG) + PAD, y: y };
                    y += heights[idx] + RG;
                });
            });

            return { pos: pos, edges: edges, svgW: svgW, svgH: svgH };
        }

        // ── Edge geometry ─────────────────────────────────────────────────
        // Nodes are boxes {x, y, w, h}. An ordinary edge leaves the right edge of
        // its source and enters the left edge of its target; a loop edge leaves the
        // top of its source, arcs back over everything in between, and drops onto
        // the top of its target, so it is never mistaken for the forward edge it
        // runs alongside. An edge with a `bow` skips a column: it sags below the
        // nodes it passes instead of running straight through them.
        var LOOP_LIFT = 70;
        function loopLift(a, b) { return LOOP_LIFT + Math.abs((a.x + a.w / 2) - (b.x + b.w / 2)) * 0.08; }
        function edgePath(a, b, e) {
            if (e.loop) {
                var lx1 = a.x + a.w / 2, ly1 = a.y, lx2 = b.x + b.w / 2, ly2 = b.y;
                var lift = loopLift(a, b);
                return 'M ' + lx1 + ' ' + ly1 +
                    ' C ' + lx1 + ' ' + (ly1 - lift) + ', ' + lx2 + ' ' + (ly2 - lift) + ', ' + lx2 + ' ' + ly2;
            }
            var x1 = a.x + a.w, y1 = a.y + a.h / 2;
            var x2 = b.x, y2 = b.y + b.h / 2;
            if (e.bow) {
                var third = (x2 - x1) / 3;
                return 'M ' + x1 + ' ' + y1 +
                    ' C ' + (x1 + third) + ' ' + (y1 + e.bow) + ', ' + (x2 - third) + ' ' + (y2 + e.bow) + ', ' + x2 + ' ' + y2;
            }
            if (x2 <= x1 + 20) {
                var bend = 80 + Math.abs(y1 - y2) * 0.12;
                return 'M ' + x1 + ' ' + y1 +
                    ' C ' + (x1 + bend) + ' ' + y1 + ', ' + (x2 - bend) + ' ' + y2 + ', ' + x2 + ' ' + y2;
            }
            var cx = (x1 + x2) / 2;
            return 'M ' + x1 + ' ' + y1 + ' C ' + cx + ' ' + y1 + ', ' + cx + ' ' + y2 + ', ' + x2 + ' ' + y2;
        }
        function edgeMidpoint(a, b, e) {
            if (e.loop) {
                // The midpoint of the cubic above sits three quarters of the lift
                // above the two anchors' mean.
                return { x: (a.x + a.w / 2 + b.x + b.w / 2) / 2, y: (a.y + b.y) / 2 - loopLift(a, b) * 0.75 - 4 };
            }
            var sag = e.bow ? e.bow * 0.75 : 0;
            return { x: (a.x + a.w + b.x) / 2, y: (a.y + a.h / 2 + b.y + b.h / 2) / 2 - 8 + sag };
        }

        // Several edges between the same two columns land on near-identical midpoints,
        // which stacks their labels into an unreadable smudge. Bucket the midpoints and
        // lift each subsequent label clear of the one already there.
        var LBL_BUCKET_X = 90, LBL_BUCKET_Y = 14, LBL_STACK = 12;

        function stackedLabelPositions(edges, nodes) {
            var taken = new Map();
            return edges.map(function (e) {
                var m = edgeMidpoint(nodes[e.from], nodes[e.to], e);
                var bucket = Math.round(m.x / LBL_BUCKET_X) + ':' + Math.round(m.y / LBL_BUCKET_Y);
                var stacked = taken.get(bucket) || 0;
                taken.set(bucket, stacked + 1);
                return { x: m.x, y: m.y - stacked * LBL_STACK };
            });
        }

        // ── Build node inner HTML (foreignObject content) ─────────────────
        function buildNodeHtml(step) {
            // Every value below reaches innerHTML, so the type-derived class name is
            // escaped like any other field even though it originates server-side.
            var tc = esc((step.type || '').toLowerCase());
            var typeLabel = step.goal && step.type !== 'AchievesGoal' ? step.type + ' \u00b7 GOAL' : step.type;

            // Micro-badges
            var badges = '';
            if (step.goal && step.type !== 'AchievesGoal') badges += '<span class="nb nb-goal">\u2605 GOAL</span>';
            if (step.exportedRemote) badges += '<span class="nb nb-mcp">\u26a1 MCP' + (step.exportName ? ': ' + esc(step.exportName) : '') + '</span>';
            if (step.canRerun) badges += '<span class="nb nb-rerun">\u21ba canRerun</span>';
            if (step.readOnly) badges += '<span class="nb nb-readonly">\u26d4 readOnly</span>';
            if (step.llmTool && step.type !== 'LlmTool') badges += '<span class="nb nb-llmtool">\u2699 LLM Tool</span>';
            if (step.clearBlackboard) badges += '<span class="nb nb-clearbb">\u2715 clears BB</span>';
            if (step.trigger) badges += '<span class="nb nb-trigger">\u2607 on ' + esc(step.trigger) + '</span>';
            if (step.llmToolReturnDirect) badges += '<span class="nb nb-returndirect">\u21a9 returnDirect</span>';
            // @Export(local = false): goal is not callable by local in-process callers
            if (step.goal && step.exportedLocal === false) badges += '<span class="nb nb-clearbb">\u2298 not local</span>';
            // Runtime provenance. registered is null when no agent platform was available
            // to ask, in which case we claim nothing either way.
            if (step.plannerGenerated) badges += '<span class="nb nb-planner">\u2699 planner</span>';
            else if (step.registered === false) badges += '<span class="nb nb-unregistered">\u26a0 not in plan</span>';

            var html = '<div xmlns="http://www.w3.org/1999/xhtml" class="nfo">';
            html += '<div class="ntype-row"><span class="ntype ' + tc + '">' + esc(typeLabel) + '</span>' + badges + '</div>';
            html += '<div class="nname">' + esc(step.name) + '</div>';

            // Method (when distinct from name — almost always identical, but useful for state-bound actions)
            if (step.method && step.method !== step.name) {
                html += '<div class="nmeth">\u0192 ' + esc(step.method) + '()</div>';
            }

            // Input / output / outputBinding / possibleOutputs
            var inputs = (step.inputs || []).length ? step.inputs.join(', ') : '\u2014';
            var outputLabel = step.output || 'void';
            var nioHtml = esc(inputs) + ' \u2192 ' + esc(outputLabel);
            if (step.outputBinding)
                nioHtml += ' <span class="obind">\u00bb ' + esc(step.outputBinding) + '</span>';
            if (step.possibleOutputs && step.possibleOutputs.length)

            if (preList.length)
                html += '<div class="nrow cpre"><span class="lbl">pre</span><span class="val">' + esc(preList.join(', ')) + '</span></div>';
            preSpelList.forEach(function (sp) {
                html += '<div class="nrow cspel"><span class="lbl">SpEL</span><span class="val">' + esc(sp.substring(5)) + '</span></div>';
            });

                html += '<div class="nrow cpost"><span class="lbl">post</span><span class="val">' + esc(step.post.join(', ')) + '</span></div>';

            // Per-action retry policy (@Action(actionRetryPolicyExpression = ...))

                html += '<div class="nrow cretry"><span class="lbl">retry</span><span class="val">' + esc(step.retryPolicy) + '</span></div>';

            // Per-action retry policy constant (@Action(actionRetryPolicy = ...))

                html += '<div class="nrow ccost"><span class="lbl">cost</span><span class="val">\u00a7 ' + esc(step.costMethod) + '()</span></div>';
            else if (step.cost != null)
                html += '<div class="nrow ccost"><span class="lbl">cost</span><span class="val">' + esc(step.cost) + '</span></div>';
            if (step.valueMethod)
                html += '<div class="nrow cval"><span class="lbl">value</span><span class="val">\u00a7 ' + esc(step.valueMethod) + '()</span></div>';

                html += '<div class="nrow cval"><span class="lbl">value</span><span class="val">' + esc(step.value) + '</span></div>';

                html += '<div class="ndesc">' + esc(step.description) + '</div>';

            // LLM Tool category (@LlmTool(category = ...))
            if (step.llmToolCategory)
                html += '<div class="nrow"><span class="lbl">category</span>' + esc(step.llmToolCategory) + '</div>';

            // Explicit LLM tool name (@LlmTool(name = ...))

                html += '<div class="nrow"><span class="lbl">tool name</span>' + esc(step.llmToolName) + '</div>';

            // LLM tool metadata (@LlmTool(metadata = @Meta(key, value)))

                step.llmToolMetadata.forEach(function (meta) {

                });

            if (step.exportStartingInputTypes && step.exportStartingInputTypes.length)
                html += '<div class="nrow"><span class="lbl">starts from</span><span class="val">' + esc(step.exportStartingInputTypes.join(', ')) + '</span></div>';

                html += '<div class="nrow"><span class="lbl">provided</span><span class="val">' + esc(step.providedInputs.join(', ')) + '</span></div>';

                html += '<div class="nrow"><span class="lbl">name match</span><span class="val">' + esc(step.nameMatchInputs.join(', ')) + '</span></div>';

                html += '<div class="nexs">';

        }

        // ── Measure heights for node content (offscreen DOM) ──────────────
        function measureHeights(htmls, width) {

                var w = document.createElement('div');

                w.style.width = width + 'px';
                w.innerHTML = html;
                host.appendChild(w);
                return w;
            });
            document.body.appendChild(host);
            var heights = wraps.map(function (w) {
                // A hidden or not-yet-laid-out host measures as 0; NH_MIN would then
                // clip a tall node, so fall back to a height that fits one instead.
                var box = w.firstChild && w.firstChild.getBoundingClientRect();
                if (!box || box.height <= 0) return NH_FALLB;
                return Math.max(NH_MIN, Math.ceil(box.height) + 2);

        // ── Draggable, zoomable graph canvas ──────────────────────────────

                        lblEls[ei].setAttribute('y', labelPos[ei].y);

            var nodeAdj = nodes.map(function () { return []; });
            edges.forEach(function (e, ei) {

            // Build node elements
            var nodeGs = [];
            nodes.forEach(function (n, i) {
                var g = document.createElementNS(xns, 'g');
                g.setAttribute('class', 'node-g');

                // shows. setAttribute writes a plain string rather than markup, so
                // the label is used raw here, as the other aria-labels in this file do.

                // Not a button: focusing a node spotlights it and the arrow keys move

                // an Enter or Space that does nothing. A group carries the label and the
                // roledescription below without offering an affordance that is not there.

            svg.addEventListener('wheel', function (e) {

                    nodes.forEach(function (_, i) { positionNode(i); });
                    refreshEdges(null); requestAnimationFrame(naturalView);
                },
                highlightEdges: spotlightEdges,
