name: CodeQL

# Static security analysis via GitHub CodeQL.
# Runs on push/PR to main and weekly to catch newly-published CVEs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

# Read-only by default so that a step added to a future job cannot quietly
# inherit a write scope; the one job that needs to write asks for it below.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the SARIF results
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java
          queries: security-extended

      - name: Build for CodeQL
        run: ./mvnw -B --no-transfer-progress --no-snapshot-updates -DskipTests compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:java
