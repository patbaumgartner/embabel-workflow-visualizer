version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - java
  commit-message:
    prefix: build
    prefix-development: build
    include: scope
- package-ecosystem: github-actions
  groups:
    codeql-action:
      patterns:
      - github/codeql-action*
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 10
  labels:
  - dependencies
  - github_actions
  commit-message:
    prefix: ci
    include: scope
groups:
  multi-step-actions:
    patterns:
    - github/codeql-action/*
