        }

        // ── Dependency graph: one card per declared step ──────────────────
        function makeDependencyCanvas(steps) {
            var heights = measureHeights(steps.map(buildNodeHtml), NW);
            var layout = computeLayout(steps, heights);
            var nodes = steps.map(function (step, i) {
                var label = step.name + ', ' + (step.type || 'Step');
                if (step.goal && step.type !== 'AchievesGoal') label += ', goal';
                if (step.plannerGenerated) label += ', planner-generated';
                else if (step.registered === false) label += ', not in plan';
                var cls = (step.type || '').toLowerCase() + (step.registered === false ? ' not-registered' : '');
                return {
                    x: layout.pos[i].x, y: layout.pos[i].y, w: NW, h: heights[i], rx: 11,
                    ariaLabel: label, roleDesc: 'workflow step', render: cardRenderer(cls, buildNodeHtml(step))
                };
            });
            var edges = layout.edges.map(function (e) {
                return { from: e.from, to: e.to, cls: e.kind, marker: e.kind, label: e.label, loop: false };
            });
            return makeGraphCanvas({
                nodes: nodes, edges: edges, svgW: layout.svgW, svgH: layout.svgH,
                markers: { pre: 'var(--condition)', type: 'var(--type-col)', cost: 'var(--cost)' },
                ariaLabel: 'Dependency graph with ' + steps.length + ' step' + (steps.length === 1 ? '' : 's') +
                    ': ' + steps.map(function (s) { return s.name; }).join(', ')
            });
        }

        // ── Flow chart: Start → actions → End, as the backend derived it ──
        var FW = 240;      // flow action card width
        var FCG = 140;     // flow column gap, wide enough for a "Type · if condition" label
        var FRG = 34;      // flow row gap
        var BOW = 130;     // how far a column-skipping edge sags below the column it skips (clears a card)
        var DETACHED_GAP = 64;
        var SPEL = 'spel:';

        function stripSpel(c) { return typeof c === 'string' && c.indexOf(SPEL) === 0 ? c.substring(SPEL.length) : c; }

        // The compact card: what the step is, what it hands over, what it costs.
        // Everything else lives on the Dependencies tab and in the title tooltip.
        function buildFlowCardHtml(step, node) {
            var tc = esc((step.type || 'Action').toLowerCase());
            var badges = '';
            if (step.goal && step.type !== 'AchievesGoal') badges += '<span class="nb nb-goal">\u2605 GOAL</span>';
            if (step.canRerun) badges += '<span class="nb nb-rerun">\u21ba canRerun</span>';
            if (step.readOnly) badges += '<span class="nb nb-readonly">\u26d4 readOnly</span>';
            if (step.clearBlackboard) badges += '<span class="nb nb-clearbb">\u2715 clears BB</span>';
            if (step.plannerGenerated) badges += '<span class="nb nb-planner">\u2699 planner</span>';
            if (node.kind === 'DETACHED') badges += '<span class="nb nb-detached">\u26a0 ' + esc(node.label) + '</span>';

            var tip = (step.type || 'Action') + ' ' + step.name;
            if (step.description) tip += '\n' + step.description;
            tip += '\n' + ((step.inputs || []).join(', ') || '\u2014') + ' \u2192 ' + (step.output || 'void');
            if ((step.pre || []).length) tip += '\npre: ' + step.pre.join(', ');
            if ((step.post || []).length) tip += '\npost: ' + step.post.join(', ');

            var html = '<div xmlns="http://www.w3.org/1999/xhtml" class="nfo" title="' + esc(tip) + '">';
            html += '<div class="ntype-row"><span class="ntype ' + tc + '">' + esc(step.type || 'Action') + '</span>' + badges + '</div>';
            html += '<div class="nname">' + esc(step.name) + '</div>';
            var optional = new Set(step.optionalInputs || []);
            var ins = (step.inputs || []).map(function (t) { return esc(t) + (optional.has(t) ? '?' : ''); });
            html += '<div class="nio">' + (ins.length ? ins.join(', ') : '\u2014') + ' \u2192 ' + esc(step.output || 'void') + '</div>';
            if (step.costMethod)
                html += '<div class="nrow ccost"><span class="lbl">cost</span><span class="val">\u00a7 ' + esc(step.costMethod) + '()</span></div>';
            else if (step.cost != null)
                html += '<div class="nrow ccost"><span class="lbl">cost</span><span class="val">' + esc(step.cost) + '</span></div>';
            html += '</div>';
            return html;
        }

        function terminalRenderer(kind, title, sub) {
            return function (g, n) {
                g.appendChild(svgEl('rect', { 'class': 'fterm ' + kind, width: n.w, height: n.h, rx: n.h / 2 }));
                var t = svgEl('text', { 'class': 'fterm-lbl', x: n.w / 2, y: sub ? n.h / 2 - 3 : n.h / 2 + 4, 'text-anchor': 'middle' });
                t.textContent = title;
                g.appendChild(t);
                if (sub) {
                    var s = svgEl('text', { 'class': 'fterm-sub', x: n.w / 2, y: n.h / 2 + 12, 'text-anchor': 'middle' });
                    s.textContent = sub;
                    g.appendChild(s);
                }
            };
        }
        function decisionRenderer(node) {
            var detail = (node.detail || 'CONDITION').toLowerCase();
            var kindLabel = detail === 'spel' ? 'SpEL' : detail === 'state' ? 'state' : detail === 'planner' ? 'planner choice' : 'condition';
            return function (g, n) {
                var pts = (n.w / 2) + ',0 ' + n.w + ',' + (n.h / 2) + ' ' + (n.w / 2) + ',' + n.h + ' 0,' + (n.h / 2);
                g.appendChild(svgEl('polygon', { 'class': 'fdecision ' + detail, points: pts }));
                var fo = svgEl('foreignObject', { x: n.w * 0.17, y: n.h * 0.18, width: n.w * 0.66, height: n.h * 0.64 });
                fo.style.pointerEvents = 'none';
                fo.innerHTML = '<div xmlns="http://www.w3.org/1999/xhtml" class="fdec-body" title="' + esc(node.label || '') + '">' +
                    '<span class="fdec-kind">' + esc(kindLabel) + '</span>' +
                    (node.label && node.label !== kindLabel ? '<span class="fdec-lbl">' + esc(node.label) + '</span>' : '') + '</div>';
                g.appendChild(fo);
            };
        }
        function barRenderer(kind) {
            return function (g, n) {
                g.appendChild(svgEl('rect', { 'class': 'fbar', width: n.w, height: n.h, rx: 3 }));
                var t = svgEl('text', { 'class': 'fbar-lbl', x: n.w / 2, y: n.h + 12, 'text-anchor': 'middle' });
                t.textContent = kind;
                g.appendChild(t);
            };
        }

        function computeFlowLayout(flow, nodes, edges) {
            var idx = new Map();
            flow.nodes.forEach(function (n, i) { idx.set(n.id, i); });
            var main = [], detached = [];
            flow.nodes.forEach(function (n, i) { (n.kind === 'DETACHED' ? detached : main).push(i); });
            var isMain = new Set(main);

            // Forward edges only: a loop points upstream by definition and would
            // otherwise push its target one column past its source forever.
            var preds = nodes.map(function () { return []; });
            flow.edges.forEach(function (e) {
                var a = idx.get(e.from), b = idx.get(e.to);
                if (a == null || b == null || e.loop || !isMain.has(a) || !isMain.has(b)) return;
                preds[b].push(a);
            });

            // Longest path from Start, iterative and cycle-safe like computeLayout.
            var maxCol = Math.max(0, main.length - 1);
            var col = nodes.map(function () { return 0; });
            for (var pass = 0; pass < main.length + 6; pass++) {
                var changed = false;
                main.forEach(function (i) {
                    var c = 0;
                    preds[i].forEach(function (p) { c = Math.max(c, col[p] + 1); });
                    if (c > maxCol) c = maxCol;
                    if (col[i] !== c) { col[i] = c; changed = true; }
                });
                if (!changed) break;
            }
            // Every End sits in the last column, whatever the length of its route.
            var lastCol = 0;
            main.forEach(function (i) { if (flow.nodes[i].kind !== 'END') lastCol = Math.max(lastCol, col[i]); });
            main.forEach(function (i) { if (flow.nodes[i].kind === 'END') col[i] = lastCol + 1; });

            var usedCols = Array.from(new Set(main.map(function (i) { return col[i]; }))).sort(function (a, b) { return a - b; });
            var dense = {};
            usedCols.forEach(function (c, i) { dense[c] = i; });
            var cols = usedCols.map(function () { return []; });
            main.forEach(function (i) { col[i] = dense[col[i]]; cols[col[i]].push(i); });

            // Order each column by the mean row of its predecessors so branches fan
            // out from their decision instead of crossing back over it.
            var row = nodes.map(function () { return 0; });
            cols.forEach(function (members, c) {
                if (c > 0) {
                    members.sort(function (a, b) {
                        function mean(i) {
                            var ps = preds[i];
                            if (!ps.length) return row[i];
                            return ps.reduce(function (s, p) { return s + row[p]; }, 0) / ps.length;
                        }
                        return mean(a) - mean(b) || a - b;
                    });
                }
                members.forEach(function (i, r) { row[i] = r; });
            });

            var colW = cols.map(function (members) {
                return members.reduce(function (m, i) { return Math.max(m, nodes[i].w); }, 0);
            });
            var colH = cols.map(function (members) {
                return members.reduce(function (s, i, k) { return s + nodes[i].h + (k ? FRG : 0); }, 0);
            });
            var mainH = Math.max.apply(null, colH.concat([0]));
            // Loop edges arc above the chart, so leave them room at the top.
            var hasLoop = flow.edges.some(function (e) { return e.loop; });
            var top = PAD + (hasLoop ? LOOP_LIFT + 20 : 0);
            var x = PAD;
            cols.forEach(function (members, c) {
                var y = top + (mainH - colH[c]) / 2;
                members.forEach(function (i) {
                    nodes[i].x = x + (colW[c] - nodes[i].w) / 2;
                    nodes[i].y = y;
                    y += nodes[i].h + FRG;
                });
                x += colW[c] + FCG;
            });
            var mainW = cols.length ? x - FCG + PAD : PAD * 2;

            // An edge that skips a column would run straight through whatever sits
            // in it, so it sags below instead; two such edges alternate their depth
            // so they stay apart, and the chart grows to make room for the deepest.
            var bowed = 0, deepest = 0;
            edges.forEach(function (e) {
                if (e.loop || !isMain.has(e.from) || !isMain.has(e.to)) return;
                if (col[e.to] - col[e.from] >= 2) {
                    e.bow = BOW * (1 + (bowed++ % 2) * 0.6);
                    deepest = Math.max(deepest, e.bow * 0.75);
                }
            });
            mainH += deepest;

            // Steps outside every route sit in their own strip below the chart.
            var box = null;
            if (detached.length) {
                var dy = top + mainH + DETACHED_GAP;
                var dx = PAD + 14;
                var dh = 0;
                detached.forEach(function (i) {
                    nodes[i].x = dx; nodes[i].y = dy + 14;
                    dx += nodes[i].w + 24;
                    dh = Math.max(dh, nodes[i].h);
                });
                box = { x: PAD, y: dy - 14, w: dx - 24 + 14 - PAD, h: dh + 28 + 14 };
                mainW = Math.max(mainW, box.x + box.w + PAD);
            }
            var svgH = (box ? box.y + box.h : top + mainH) + PAD;
            return { svgW: mainW, svgH: svgH, detachedBox: box };
        }

        function makeFlowChartCanvas(agent) {
            var flow = agent.flow;
            var byName = new Map();
            (agent.steps || []).forEach(function (s) { byName.set(s.name, s); });
            var idx = new Map();
            flow.nodes.forEach(function (n, i) { idx.set(n.id, i); });

            var cardHtml = flow.nodes.map(function (n) {
                if (n.kind !== 'ACTION' && n.kind !== 'DETACHED') return null;
                var step = byName.get(n.step) || { name: n.step, type: 'Action' };
                return buildFlowCardHtml(step, n);
            });
            var heights = measureHeights(cardHtml.map(function (h) { return h || '<div></div>'; }), FW)
                .map(function (h, i) { return cardHtml[i] ? h : 0; });

            var nodes = flow.nodes.map(function (n, i) {
                switch (n.kind) {
                    case 'START':
                        return { x: 0, y: 0, w: 96, h: 40, rx: 20, ariaLabel: 'Start', roleDesc: 'flow start', render: terminalRenderer('start', 'Start') };
                    case 'END':
                        return {
                            x: 0, y: 0, w: Math.max(120, 30 + (n.label || '').length * 6.5), h: 52, rx: 26,
                            ariaLabel: 'End, goal ' + n.step + (n.label ? ', produces ' + n.label : ''), roleDesc: 'flow end',
                            render: terminalRenderer('end', 'End', n.label)
                        };
                    case 'DECISION':
                        return {
                            x: 0, y: 0, w: 200, h: 96, rx: 8, ariaLabel: 'Decision, ' + (n.label || 'condition'), roleDesc: 'decision',
                            render: decisionRenderer(n)
                        };
                    case 'FORK':
                    case 'JOIN':
                        return { x: 0, y: 0, w: 8, h: 64, rx: 3, ariaLabel: n.kind === 'FORK' ? 'Fork, steps run in parallel' : 'Join, waits for all branches', roleDesc: n.kind.toLowerCase(), render: barRenderer(n.kind.toLowerCase()) };
                    default: {
                        var step = byName.get(n.step) || { name: n.step, type: 'Action' };
                        var cls = (step.type || 'action').toLowerCase() + (n.kind === 'DETACHED' ? ' not-registered' : '');
                        var label = n.step + ', ' + (step.type || 'Action') + (n.kind === 'DETACHED' ? ', ' + n.label : '');
                        return { x: 0, y: 0, w: FW, h: heights[i], rx: 11, ariaLabel: label, roleDesc: 'workflow step', render: cardRenderer(cls, cardHtml[i]), kind: n.kind };
                    }
                }
            });

            var cheapest = new Set();
            flow.paths.forEach(function (p, i) { if (p.cheapest) cheapest.add(i); });
            var edges = [];
            flow.edges.forEach(function (e) {
                var a = idx.get(e.from), b = idx.get(e.to);
                if (a == null || b == null) return;
                var conds = (e.conditions || []).map(stripSpel);
                var types = e.types || [];
                var label = types.join(', ');
                if (conds.length) label = (label ? label + ' \u00b7 ' : '') + 'if ' + conds.join(' & ');
                if (e.loop) label = '\u21ba loop' + (label ? ' \u00b7 ' + label : '');
                var onCheapest = (e.paths || []).some(function (p) { return cheapest.has(p); });
                var cls = e.loop ? 'loop' : conds.length ? 'branch' : 'flow';
                if (onCheapest && !e.loop) cls += ' cheapest';
                edges.push({
                    from: a, to: b, loop: !!e.loop, label: label, paths: e.paths || [],
                    cls: cls, marker: e.loop ? 'loop' : onCheapest ? 'cheapest' : conds.length ? 'branch' : 'flow',
                    labelCls: e.loop ? 'loop' : conds.length ? 'branch' : 'types'
                });
            });

            var layout = computeFlowLayout(flow, nodes, edges);
            var canvas = makeGraphCanvas({
                nodes: nodes, edges: edges, svgW: layout.svgW, svgH: layout.svgH,
                markers: { flow: 'var(--muted)', cheapest: 'var(--goal)', branch: 'var(--condition)', loop: 'var(--brand-orange)' },
                ariaLabel: 'Flow chart from Start to ' + flow.paths.length + ' route' + (flow.paths.length === 1 ? '' : 's') +
                    ' ending in a goal' + (agent.plannerType ? ', ' + agent.plannerType + ' planner' : ''),
                decorate: function (g) {
                    if (!layout.detachedBox) return;
                    var b = layout.detachedBox;
                    g.appendChild(svgEl('rect', { 'class': 'fgroup-box', x: b.x, y: b.y, width: b.w, height: b.h, rx: 12 }));
                    var t = svgEl('text', { 'class': 'fgroup-lbl', x: b.x + 14, y: b.y - 6 });
                    t.textContent = 'Not on any route to a goal';
                    g.appendChild(t);
                }
            });
            // Route k is the set of edges tagged with k. Loops carry no path index,
            // so they stay dim while a route is lit.
            canvas.edgesOfPath = function (k) {
                var out = [];
                edges.forEach(function (e, ei) { if (e.paths.indexOf(k) !== -1) out.push(ei); });
                return out;
            };
            return canvas;
        }

        // Zoom controls, one strip per drawing
        function controlsFor(canvas, what, agentName) {
            var ctrl = document.createElement('div');
            ctrl.className = 'flow-controls';
            ctrl.setAttribute('role', 'group');
            ctrl.setAttribute('aria-label', what + ' controls for ' + agentName);
            function flowButton(label, action) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'flow-btn';
                b.textContent = label;
                b.setAttribute('aria-label', label.replace(/^\S+\s/, '') + ' \u2014 ' + agentName + ' ' + what);
                b.onclick = action;
                return b;
            }
            var fhint = document.createElement('span'); fhint.className = 'flow-hint';
            fhint.textContent = 'Drag\u00a0nodes \u00b7 Ctrl/\u2318+scroll\u00a0to\u00a0zoom \u00b7 Drag\u00a0background\u00a0to\u00a0pan \u00b7 Dbl-click\u00a0to\u00a0fit'
                + ' \u00b7 Tab\u00a0to\u00a0a\u00a0node, arrows\u00a0move\u00a0it';
            ctrl.append(
                flowButton('\u22a1 Fit', canvas.fit),
                flowButton('+ Zoom In', canvas.zoomIn),
                flowButton('\u2212 Zoom Out', canvas.zoomOut),
                flowButton('\u21ba Reset Layout', canvas.reset),
                fhint);
            return ctrl;
        }
        function canvasBox(canvas) {
            var flow = document.createElement('div');
            flow.className = 'flow';
            flow.dataset.naturalHeight = String(canvas.naturalHeight);
            flow.appendChild(canvas.svgEl);
            return flow;
        }

        function sizeDiagrams(viewPanels) {
            // Size the diagram viewport, not the panel containing its legend and
            // route details. Both views use the larger graph's natural height;
            // initially cap tall graphs to the window and let the reader expand.
            var boxes = viewPanels.map(function (view) { return view.querySelector('div.flow'); });
            var grips = [];
            var diagramHeight = Math.max(240, Math.min(
                Math.max.apply(null, boxes.map(function (box) { return Number(box.dataset.naturalHeight); })),
                Math.min(window.innerHeight * 0.72, 660)));
            function applyDiagramHeight(h) {
                diagramHeight = Math.max(240, Math.round(h));
                boxes.forEach(function (box) { box.style.height = diagramHeight + 'px'; });
                grips.forEach(function (grip) { grip.setAttribute('aria-valuenow', String(diagramHeight)); });
            }
            function addResizer(box) {
                var grip = document.createElement('div');
                grip.className = 'view-resize';
                grip.tabIndex = 0;
                grip.setAttribute('role', 'separator');
                grip.setAttribute('aria-label', 'Diagram height');
                grip.setAttribute('aria-orientation', 'horizontal');
                grip.setAttribute('aria-valuemin', '240');
                box.after(grip);
                grips.push(grip);
                grip.addEventListener('keydown', function (e) {
                    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown' && e.key !== 'Home') return;
                    e.preventDefault();
                    applyDiagramHeight(e.key === 'Home' ? 240 : diagramHeight +
                        (e.key === 'ArrowDown' ? 1 : -1) * (e.shiftKey ? 100 : 20));
                });
                grip.addEventListener('pointerdown', function (e) {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.preventDefault();
                    grip.setPointerCapture(e.pointerId);
                    var startY = e.clientY, startH = diagramHeight;
                    function move(ev) {
                        applyDiagramHeight(startH + ev.clientY - startY);
                    }
                    function up() {
                        grip.removeEventListener('pointermove', move);
                        grip.removeEventListener('pointerup', up);
                        grip.removeEventListener('pointercancel', up);
                        grip.removeEventListener('lostpointercapture', up);
                    }
                    grip.addEventListener('pointermove', move);
                    grip.addEventListener('pointerup', up);
                    grip.addEventListener('pointercancel', up);
                    grip.addEventListener('lostpointercapture', up);
                });
            }
            boxes.forEach(addResizer);
            applyDiagramHeight(diagramHeight);
        }

        function viewTabs(agentName, views) {
            // Each agent owns its tabs; filtering preserves its selection and layout.
            var tabs = document.createElement('div');
            tabs.className = 'view-tabs';
            tabs.setAttribute('role', 'tablist');
            tabs.setAttribute('aria-label', 'Views of ' + agentName);
            var seq = String(panelSeq++);
            var tabEls = views.map(function (v, i) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'view-tab';
                b.id = 'tab-' + seq + '-' + v.key;
                b.setAttribute('role', 'tab');
                b.textContent = v.label;
                v.panel.id = 'view-' + seq + '-' + v.key;
                v.panel.setAttribute('role', 'tabpanel');
                v.panel.setAttribute('aria-labelledby', b.id);
                b.setAttribute('aria-controls', v.panel.id);
                b.addEventListener('click', function () { selectView(v.key); });
                b.addEventListener('keydown', function (e) {
                    var next = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : e.key === 'Home' ? 0 : e.key === 'End' ? views.length - 1 : null;
                    if (next === null) return;
                    e.preventDefault();
                    next = (next + views.length) % views.length;
                    selectView(views[next].key);
                    tabEls[next].focus();
                });
                tabs.appendChild(b);
                return b;
            });
            function selectView(key) {
                views.forEach(function (v, i) {
                    var on = v.key === key;
                    tabEls[i].setAttribute('aria-selected', String(on));
                    tabEls[i].tabIndex = on ? 0 : -1;
                    v.panel.hidden = !on;
                });
            }
            selectView(views[0].key);

            return tabs;
        }

        // ── Render one agent panel ────────────────────────────────────────
        var panelSeq = 0;
        function plannerCls(pt) {
            if (!pt) return '';
            switch (pt.toUpperCase()) {
                case 'GOAP': return 'planner-goap';
                case 'UTILITY': return 'planner-utility';
                case 'HYBRID': return 'planner-hybrid';
                case 'SUPERVISOR': return 'planner-supervisor';
                case 'COMPONENT': return 'planner-component';
                case 'RUNTIME': return 'planner-runtime';
                default: return 'planner-goap';
            }
        }

        function renderAgent(agent) {
            var panel = document.createElement('section');
            panel.className = 'agent';
            panel.setAttribute('aria-label', agent.agentName);
            panel.dataset.search = [agent.agentName, agent.className, agent.plannerType, agent.description,
                agent.provider, agent.beanName].filter(Boolean).join(' ').toLowerCase();

            // Header row: name + planner badge + opaque badge + version/class
            var hdr = document.createElement('div');
            hdr.className = 'agent-header';

            var titleRow = document.createElement('div');
            titleRow.className = 'agent-title-row';

            var h2 = document.createElement('h2');
            h2.textContent = agent.agentName;
            titleRow.appendChild(h2);

            if (agent.plannerType) {
                var pb = document.createElement('span');
                pb.className = 'planner-badge ' + plannerCls(agent.plannerType);
                pb.textContent = agent.plannerType;
                titleRow.appendChild(pb);
            }
            if (agent.opaque) {
                var ob = document.createElement('span');
                ob.className = 'opaque-badge';
                ob.textContent = 'opaque';
                titleRow.appendChild(ob);
            }
            if (agent.registered === false) {
                var nrb = document.createElement('span');
                nrb.className = 'opaque-badge';
                nrb.textContent = 'not deployed';
                nrb.title = 'Annotated, but the running agent platform did not register this agent';
                titleRow.appendChild(nrb);
            }
            // @Agent(scan = false) / @EmbabelComponent(scan = false) disables step discovery
            if (agent.scan === false) {
                var nsb = document.createElement('span');
                nsb.className = 'opaque-badge';
                nsb.textContent = 'scan off';
                titleRow.appendChild(nsb);
            }
            hdr.appendChild(titleRow);

            var metaSpan = document.createElement('span');
            metaSpan.className = 'agent-meta';
            metaSpan.textContent = agent.className + (agent.version ? ' \u00b7 v' + agent.version : '')
                + (agent.provider ? ' \u00b7 ' + agent.provider : '')
                + (agent.beanName ? ' \u00b7 bean: ' + agent.beanName : '')
                + (agent.retryPolicy ? ' \u00b7 retry: ' + agent.retryPolicy : '')
                + (agent.retryPolicyExpression ? ' \u00b7 retry: ' + agent.retryPolicyExpression : '');
            hdr.appendChild(metaSpan);

            panel.appendChild(hdr);

            if (agent.description) {
                var p = document.createElement('p');
                p.className = 'desc';
                p.textContent = agent.description;
                panel.appendChild(p);
            }

            var steps = agent.steps || [];
            if (!steps.length) {
                var emptyEl = document.createElement('div');
                emptyEl.className = 'empty';
                emptyEl.textContent = 'No workflow steps declared on this agent.';
                panel.appendChild(emptyEl);
                return panel;
            }

            // Legend
            var leg = document.createElement('div');
            leg.className = 'legend';
            leg.innerHTML =
                '<span class="leg-item"><span class="swatch" style="background:var(--action)"></span>Action</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--condition)"></span>Condition / pre-edge</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--goal)"></span>AchievesGoal</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--cost)"></span>Cost / cost-method edge</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--type-col)"></span>Type flow edge</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--llmtool);opacity:0.8"></span>LLM Tool</span>' +
                (steps.some(function (s) { return s.plannerGenerated || s.registered === false; })
                    ? '<span class="leg-item">\u2699 planner-generated \u00b7 \u26a0 declared but not in the plan</span>'
                    : '');

            // Dependencies view: the declared graph, one card per step.
            var depPanel = document.createElement('div');
            depPanel.className = 'view-panel';
            var depCanvas = makeDependencyCanvas(steps);
            depPanel.append(leg, controlsFor(depCanvas, 'dependency graph', agent.agentName), canvasBox(depCanvas));

            // Flow view: only when the backend derived one.
            var flowPanel = null;
            if (agent.flow && Array.isArray(agent.flow.nodes)) {
                flowPanel = document.createElement('div');
                flowPanel.className = 'view-panel';
                renderFlowView(agent, flowPanel);
            }

            if (!flowPanel) {
                panel.appendChild(depPanel);
                sizeDiagrams([depPanel]);
                return panel;
            }

            var tabs = viewTabs(agent.agentName, [
                { key: 'flow', label: 'Flow', panel: flowPanel },
                { key: 'deps', label: 'Dependencies', panel: depPanel }
            ]);
            panel.append(tabs, flowPanel, depPanel);

            sizeDiagrams([flowPanel, depPanel]);

            return panel;
        }

        // ── Flow view: chart, entry types, routes table ───────────────────
        function renderFlowView(agent, host) {
            var flow = agent.flow;
            var hasRoute = flow.paths.length > 0;

            var leg = document.createElement('div');
            leg.className = 'legend';
            leg.innerHTML =
                '<span class="leg-item"><span class="swatch" style="background:var(--ink)"></span>Start</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--goal)"></span>End (goal) / cheapest route</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--action)"></span>Action / fork &amp; join</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--condition)"></span>Decision / branch</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--brand-orange)"></span>\u21ba Loop</span>' +
                '<span class="leg-item"><span class="swatch" style="background:var(--type-col)"></span>Type handed over</span>' +
                (flow.nodes.some(function (n) { return n.kind === 'DETACHED'; })
                    ? '<span class="leg-item">\u26a0 outside every route</span>' : '');
            host.appendChild(leg);

            var canvas = makeFlowChartCanvas(agent);
            host.append(controlsFor(canvas, 'flow chart', agent.agentName), canvasBox(canvas));

            var facts = document.createElement('div');
            facts.className = 'flow-facts';

            var entry = document.createElement('div');
            entry.innerHTML = 'Starts from ' + (flow.entryTypes.length
                ? flow.entryTypes.map(function (t) { return '<code>' + esc(t) + '</code>'; }).join(', ')
                : '<em>nothing on the blackboard</em>');
            facts.appendChild(entry);

            var isComponent = (agent.plannerType || '').toUpperCase() === 'COMPONENT';
            if (!hasRoute) {
                var none = document.createElement('div');
                none.className = 'flow-warn';
                none.textContent = isComponent
                    ? 'An @EmbabelComponent lends its steps to the agents that use them; their routes are drawn on those agents.'
                    : 'No route from Start reaches a goal: nothing this agent declares produces the output of an @AchievesGoal action from the inputs it starts with.';
                facts.appendChild(none);
            }
            if (flow.truncated) {
                var trunc = document.createElement('div');
                trunc.className = 'flow-warn';
                trunc.textContent = 'Only the first ' + flow.paths.length + ' routes were enumerated; this agent has more.';
                facts.appendChild(trunc);
            }

            if (hasRoute) {
                var det = document.createElement('details');
                det.className = 'paths';
                det.open = flow.paths.length <= 6;
                var sum = document.createElement('summary');
                sum.textContent = flow.paths.length + ' route' + (flow.paths.length === 1 ? '' : 's') + ' to a goal';
                det.appendChild(sum);
                var table = document.createElement('table');
                table.innerHTML = '<thead><tr><th scope="col">#</th><th scope="col">Goal</th><th scope="col">Steps</th><th scope="col">Cost</th></tr></thead>';
                var tbody = document.createElement('tbody');
                flow.paths.forEach(function (p, k) {
                    var tr = document.createElement('tr');
                    if (p.cheapest) tr.className = 'cheapest';
                    tr.tabIndex = 0;
                    var cost = p.totalCost == null ? '\u2014' : String(p.totalCost);
                    if (p.dynamicCost) cost += ' + dynamic';
                    if (p.cheapest) cost += ' \u2605';
                    tr.innerHTML = '<td class="num">' + (k + 1) + '</td>' +
                        '<td><span class="goal-name">' + esc(p.goal) + '</span></td>' +
                        '<td>' + p.steps.map(function (s) { return '<code>' + esc(s) + '</code>'; }).join('<span class="arrow">\u2192</span>') + '</td>' +
                        '<td class="num">' + esc(cost) + '</td>';
                    tr.setAttribute('aria-label', 'Route ' + (k + 1) + ' to ' + p.goal + ': ' + p.steps.join(', ') + ', cost ' + cost);
                    function lit() { canvas.highlightEdges(canvas.edgesOfPath(k)); }
                    tr.addEventListener('mouseenter', lit);
                    tr.addEventListener('focus', function () { canvas.focusEdges(canvas.edgesOfPath(k)); });
                    tr.addEventListener('mouseleave', canvas.clearHighlight);
                    tr.addEventListener('blur', function () { canvas.focusEdges(null); });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                det.appendChild(table);
                facts.appendChild(det);
            }

            var note = document.createElement('div');
            note.className = 'flow-note';
            note.textContent = 'Derived from declared inputs, outputs and conditions. Which route runs, and the order of independent steps, is decided by the '
                + (isComponent ? 'planner of the agent that uses these steps' : (agent.plannerType || 'agent\u2019s') + ' planner')
                + ' at run time' + (flow.paths.some(function (p) { return p.dynamicCost; })
                    ? '; a @Cost method adds to the static cost shown.' : '.');
            facts.appendChild(note);

            host.appendChild(facts);
        }

        // ── Filter ────────────────────────────────────────────────────────
        // Panels are only hidden, never destroyed: each carries a laid-out SVG that
        // costs a full measure-and-fit pass to rebuild.
        function applyFilter() {
            var canvas = document.getElementById('canvas');
            var panels = canvas.querySelectorAll('.agent');
            var term = document.getElementById('agent-filter').value.trim().toLowerCase();
            var shown = 0;
            panels.forEach(function (panel) {
                var match = !term || panel.dataset.search.indexOf(term) !== -1;
                panel.hidden = !match;
                if (match) shown++;
            });
            var count = document.getElementById('agent-count');
            if (!panels.length) {
                count.textContent = '';
            } else if (shown === panels.length) {
                count.textContent = panels.length + (panels.length === 1 ? ' agent' : ' agents');
            } else {
                count.textContent = shown + ' of ' + panels.length + ' agents';
            }
            document.getElementById('no-match').hidden = shown > 0 || !panels.length;
        }

        // ── Render full catalog ───────────────────────────────────────────
        function render(catalog) {
            var canvas = document.getElementById('canvas');
            canvas.innerHTML = '';
            var agents = catalog.agents || [];
            if (!agents.length) {
                canvas.innerHTML = '<p class="empty">No Embabel <code>@Agent</code> beans found in the application context.</p>';
            } else {
                agents.forEach(function (a) { canvas.appendChild(renderAgent(a)); });
            }
            applyFilter();
        }

        document.getElementById('agent-filter').addEventListener('input', applyFilter);

        // ── Fetch workflow catalog ────────────────────────────────────────
        // The API lives at <this page>/api. Deriving it from the browser's own
        // location keeps the UI working behind a servlet context path, a reverse
        // proxy prefix, or a custom embabel.workflow.visualizer.base-path.
        var API_URL = window.location.pathname.replace(/\/+$/, '') + '/api';

        // Only the API is named here. The actuator endpoint's URL is fixed by four
        // properties this page cannot see — the servlet context path, the management
        // base path, the management port, and whether "embabel" is exposed at all — so
        // any path printed for it would be a guess, and was wrong behind a context path.
        // The README documents it; this API serves the same catalog.
        document.getElementById('endpoint-hint').innerHTML = 'API <code>' + esc(API_URL) + '</code>';

        fetch(API_URL, { headers: { 'Accept': 'application/json' }, cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(render)
            .catch(function (err) {
                document.getElementById('canvas').innerHTML =
                    '<p class="empty error">Failed to load workflows: ' + esc(err.message) + '</p>';
            });
    </script>
